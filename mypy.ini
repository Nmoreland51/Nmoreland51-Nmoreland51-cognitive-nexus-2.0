[mypy]
# Type checking is enforced for the modules listed here. Add every new module to the list;
# older modules join it as they are cleaned up.
python_version = 3.11
files = modules/file_utils.py, modules/url_safety.py, modules/event_log.py, modules/answer_meta.py, modules/nexus_config.py, modules/file_lock.py, modules/profile_store.py, modules/data_stores.py, modules/backup.py, modules/token_estimate.py, modules/context_budget.py, modules/embeddings.py, modules/chunking.py, modules/knowledge_store.py, modules/ingest.py, cognitive_nexus/version.py, tools
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
no_implicit_optional = True
