name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Resolve tag/version
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=cognitive-nexus-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_name=cognitive-nexus-${GITHUB_REF_NAME}.aab" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEYSTORE_BASE64" ] && [ -n "$ANDROID_SIGNING_STORE_PASSWORD" ] && [ -n "$ANDROID_SIGNING_KEY_ALIAS" ] && [ -n "$ANDROID_SIGNING_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PCN_RELEASE_STORE_FILE="$PWD/app/release.keystore" \
            -PCN_RELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PCN_RELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PCN_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Rename release outputs
        if: steps.signing.outputs.ready == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "android/${{ steps.version.outputs.apk_name }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "android/${{ steps.version.outputs.aab_name }}"

      - name: Upload release build artifacts
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-nexus-release-builds-${{ steps.version.outputs.tag }}
          path: |
            android/${{ steps.version.outputs.apk_name }}
            android/${{ steps.version.outputs.aab_name }}

      - name: Create GitHub release and attach binaries
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            android/${{ steps.version.outputs.apk_name }}
            android/${{ steps.version.outputs.aab_name }}
          generate_release_notes: true

      - name: Report missing signing secrets
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Signed release artifacts were not published because Android signing secrets are not configured." | tee android-release-signing-missing.txt
          {
            echo "## Android release status"
            echo "- Tag: ${{ steps.version.outputs.tag }}"
            echo "- Signed release APK/AAB: not published"
            echo "- Reason: missing one or more required secrets"
            echo "- Debug APK artifact is still produced by the build-debug job"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload missing-signing notice
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-signing-missing-${{ steps.version.outputs.tag }}
          path: android-release-signing-missing.txt
