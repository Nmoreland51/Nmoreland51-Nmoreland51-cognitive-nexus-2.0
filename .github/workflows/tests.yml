name: Tests

# Runs on every push to any branch, so pull requests from branches of this repository show the
# result on their latest commit. Use "Run workflow" on the Actions tab to run it by hand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements/dev.txt -c requirements/constraints.txt
      - name: Run tests
        # No Ollama, image backend or API keys exist here: tests must pass without them.
        # -n auto: one worker per core (the suite takes several minutes on one).
        run: python -m pytest -q -n auto

  oldest-python:
    # Python 3.11 is the oldest supported version. The pinned set needs 3.12+ (NumPy), so this
    # job installs the newest versions that still support 3.11.
    name: Python 3.11, unpinned
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pytest -q -n auto

  checks:
    name: Lint, types, secrets and ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/dev.txt -c requirements/constraints.txt
      - name: Lint (syntax errors, undefined names, unused imports)
        run: python -m ruff check .
      - name: Type-check the typed modules
        run: python -m mypy
      - name: No secrets or private runtime data in the repository
        run: python tools/check_repo_hygiene.py
      - name: Audit ledger accounts for all 146 items and is up to date
        run: python tools/audit_ledger.py check
      - name: Restriction register describes the code as it is
        run: python tools/restriction_register.py check
      - name: Final verification report says what the ledger and the saved results say
        run: python tools/final_report.py check
      - name: Known vulnerabilities in the pinned dependencies
        run: python -m pip_audit -r requirements/constraints.txt --no-deps --disable-pip --progress-spinner off
