name: Tests

# Runs on every push to any branch, so pull requests from branches of this repository show the
# result on their latest commit. Use "Run workflow" on the Actions tab to run it by hand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run tests
        # No Ollama, image backend or API keys exist here: tests must pass without them.
        run: python -m pytest -q
